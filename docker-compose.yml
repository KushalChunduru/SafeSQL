services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: safesql
      POSTGRES_USER: safesql_app
      POSTGRES_PASSWORD: safesql_app_pw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/postgres_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safesql_app -d safesql"]
      interval: 5s
      timeout: 5s
      retries: 10

  seed:
    build: .
    command: ["python", "data/seed.py"]
    environment:
      DB_BACKEND: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: safesql
      POSTGRES_USER: safesql_app
      POSTGRES_PASSWORD: safesql_app_pw
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      DB_BACKEND: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: safesql
      POSTGRES_USER: safesql_app
      POSTGRES_PASSWORD: safesql_app_pw
      POSTGRES_READONLY_USER: safesql_reader
      POSTGRES_READONLY_PASSWORD: safesql_reader_pw
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
    depends_on:
      seed:
        condition: service_completed_successfully

  frontend:
    build: .
    command: ["streamlit", "run", "frontend/streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    environment:
      SAFESQL_API_BASE: http://api:8000
    depends_on:
      - api

volumes:
  pgdata:
